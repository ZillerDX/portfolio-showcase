<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Terminal Prompt Chevron > -->
  <polyline points="7,10 14,16 7,22" fill="none" stroke="url(#blueGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Underscore Cursor _ -->
  <line x1="16" y1="22" x2="25" y2="22" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
</svg>
